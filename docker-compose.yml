x-flink-config: &flink-config
  FLINK_PROPERTIES: |
    jobmanager.rpc.address: jobmanager
    taskmanager.numberOfTaskSlots: 4
    parallelism.default: 3
    state.backend.type: hashmap
    execution.checkpointing.dir: file:///flink-data/checkpoints
    execution.checkpointing.savepoint-dir: file:///flink-data/savepoints
    execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    restart-strategy.type: exponential-delay
    jobmanager.memory.process.size: 1024m
    taskmanager.memory.process.size: 3072m
    python.executable: python3
    python.state.cache-size: 10000

services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for spec in order-events:3 order-alerts:3 order-events-dlq:1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$${spec%%:*}" --partitions "$${spec##*:}" --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic order-events
    restart: "no"

  cassandra:
    image: cassandra:5.0
    hostname: cassandra
    ports:
      - "9042:9042"
    environment:
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 200M
      CASSANDRA_CLUSTER_NAME: food-delivery
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30

  cassandra-init:
    image: cassandra:5.0
    depends_on:
      cassandra: { condition: service_healthy }
    volumes:
      - ./cassandra/schema.cql:/schema.cql:ro
    entrypoint: ["cqlsh", "cassandra", "-f", "/schema.cql"]
    restart: "no"

  jobmanager:
    build: ./flink
    image: order-flink:1.20
    hostname: jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      <<: *flink-config
    volumes:
      - flink-data:/flink-data
      - ./flink/jobs:/opt/jobs
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      cassandra-init: { condition: service_completed_successfully }

  taskmanager:
    build: ./flink
    image: order-flink:1.20
    command: taskmanager
    environment:
      <<: *flink-config
    volumes:
      - flink-data:/flink-data
      - ./flink/jobs:/opt/jobs
    depends_on:
      - jobmanager

  tools:
    build: ./flink
    image: order-flink:1.20
    profiles: ["tools"]
    working_dir: /work
    entrypoint: ["python3"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CASSANDRA_HOST: cassandra
    volumes:
      - ./producer:/work/producer
      - ./scripts:/work/scripts
      - ./flink/jobs:/work/flink/jobs

volumes:
  cassandra-data:
  flink-data:
